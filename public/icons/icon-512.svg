<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <radialGradient id="bg" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0B0C16" />
            <stop offset="100%" stop-color="#05050A" />
        </radialGradient>
        <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00F5D4" />
            <stop offset="100%" stop-color="#0284C7" />
        </linearGradient>
        <linearGradient id="grad-swoosh" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00F5D4" />
            <stop offset="50%" stop-color="#38BDF8" />
            <stop offset="100%" stop-color="#7B2CBF" />
        </linearGradient>
        <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFB800" />
            <stop offset="100%" stop-color="#FF2A55" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- App Icon Rounded Backdrop -->
    <rect width="512" height="512" rx="108" fill="url(#bg)" stroke="#1C1F36" stroke-width="4" />
    
    <!-- Outer Concentric Radar Ring -->
    <circle cx="256" cy="246" r="195" fill="none" stroke="#00F5D4" stroke-opacity="0.25" stroke-width="2" />
    <circle cx="256" cy="246" r="195" fill="none" stroke="#00F5D4" stroke-opacity="0.6" stroke-width="3" 
            stroke-dasharray="24 16 6 16 48 20" />
    <path d="M 256 51 A 195 195 0 0 1 415 125" fill="none" stroke="#00F5D4" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
    
    <!-- 4 HUD Telemetry Cards -->
    <rect x="70" y="80" width="65" height="42" rx="6" fill="#0B132B" stroke="#00F5D4" stroke-width="1.5" stroke-opacity="0.7" />
    <polygon points="85,108 94,92 103,108" fill="none" stroke="#00F5D4" stroke-width="1.5" />
    <line x1="108" y1="96" x2="124" y2="96" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="108" y1="104" x2="120" y2="104" stroke="#00F5D4" stroke-width="1.5" stroke-dasharray="2 2" />

    <rect x="377" y="80" width="65" height="42" rx="6" fill="#0B132B" stroke="#00F5D4" stroke-width="1.5" stroke-opacity="0.7" />
    <polygon points="392,108 401,92 410,108" fill="none" stroke="#FFB800" stroke-width="1.5" />
    <line x1="416" y1="106" x2="416" y2="94" stroke="#00F5D4" stroke-width="2" />
    <line x1="422" y1="106" x2="422" y2="88" stroke="#00F5D4" stroke-width="2" />
    <line x1="428" y1="106" x2="428" y2="98" stroke="#38BDF8" stroke-width="2" />

    <!-- Falcon Head Mecha Facets (Right-Facing) -->
    <polygon points="200,140 262,185 228,192 178,155" fill="#243354" stroke="#00F5D4" stroke-width="1.8" />
    <polygon points="178,155 228,192 198,212 155,188" fill="#18233C" stroke="#00F5D4" stroke-width="1.5" />
    <polygon points="155,188 198,212 175,238 142,224" fill="#0E1626" stroke="#00F5D4" stroke-width="1.5" />
    
    <polygon points="262,185 315,212 288,225 228,192" fill="#243354" stroke="#00F5D4" stroke-width="1.8" />
    <polygon points="315,212 345,230 322,242 288,225" fill="#18233C" stroke="#00F5D4" stroke-width="1.8" />
    
    <!-- Sharp Beak -->
    <polygon points="345,230 395,248 365,275 325,258 322,242" fill="#243354" stroke="#00F5D4" stroke-width="2.5" filter="url(#glow)" />
    <path d="M 345 230 L 395 248 L 365 275" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="325,258 360,275 338,284 312,270" fill="#0A0E1A" stroke="#00F5D4" stroke-width="1.6" />

    <!-- Cheek & Ear Mecha -->
    <polygon points="288,225 322,242 312,270 268,265 250,245" fill="#18233C" stroke="#00F5D4" stroke-width="1.6" />
    <polygon points="268,265 312,270 325,302 282,310 245,290" fill="#0A0E1A" stroke="#38BDF8" stroke-width="1.6" />
    <polygon points="228,192 250,245 212,268 175,238" fill="#0E1626" stroke="#00F5D4" stroke-width="1.5" />
    
    <!-- Neck Armor & Neon Circuits -->
    <polygon points="212,268 245,290 220,328 180,300 175,238" fill="#18233C" stroke="#00F5D4" stroke-width="1.5" />
    <polygon points="245,290 282,310 270,355 220,328" fill="#243354" stroke="#00F5D4" stroke-width="1.6" />
    <path d="M 175 238 L 212 268 L 245 290 L 282 310" fill="none" stroke="#FFB800" stroke-width="2" stroke-dasharray="4 3" filter="url(#glow)" />
    <circle cx="212" cy="268" r="3.5" fill="#FFB800" />
    <circle cx="282" cy="310" r="3.5" fill="#00F5D4" />

    <!-- Cyber Eye -->
    <polygon points="284,220 308,227 296,238 276,230" fill="#05070E" stroke="#00F5D4" stroke-width="2" />
    <polygon points="287,222 304,225 294,235" fill="#00F5D4" filter="url(#glow)" />
    <polygon points="291,224 299,226 294,231" fill="#FFFFFF" />

    <!-- Wave Base & Mechanical Gears -->
    <path d="M 85 345 C 135 320, 205 330, 265 365 C 318 395, 385 396, 440 376 L 435 396 C 375 418, 308 415, 255 385 C 195 350, 130 346, 85 372 Z" 
          fill="#0B132B" stroke="#00F5D4" stroke-width="1.8" />
    <path d="M 105 362 C 160 340, 220 352, 275 380 C 325 405, 390 408, 432 392" 
          fill="none" stroke="url(#grad-swoosh)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

    <!-- 3 Gears -->
    <circle cx="138" cy="360" r="20" fill="#070A14" stroke="#00F5D4" stroke-width="2" />
    <circle cx="138" cy="360" r="10" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="138" cy="360" r="4" fill="#00F5D4" filter="url(#glow)" />
    <rect x="135" y="336" width="6" height="5" fill="#00F5D4" />
    <rect x="135" y="379" width="6" height="5" fill="#00F5D4" />
    <rect x="114" y="357" width="5" height="6" fill="#00F5D4" />
    <rect x="157" y="357" width="5" height="6" fill="#00F5D4" />

    <circle cx="170" cy="344" r="13" fill="#070A14" stroke="#38BDF8" stroke-width="1.6" />
    <circle cx="170" cy="344" r="3" fill="#38BDF8" />
    
    <circle cx="172" cy="376" r="12" fill="#070A14" stroke="#00F5D4" stroke-width="1.5" />
    <circle cx="172" cy="376" r="2.5" fill="#00F5D4" />

    <!-- "SOULY" typography inside icon -->
    <text x="320" y="396" font-family="'Readex Pro', sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="url(#grad-cyan)" filter="url(#glow)">SOULY</text>
    <path d="M 315 408 Q 365 418 415 406" fill="none" stroke="url(#grad-swoosh)" stroke-width="2.5" stroke-linecap="round" />
</svg>